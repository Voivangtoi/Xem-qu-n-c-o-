    <script>
        function xemQuangCao() {
            let userId = "guest_user";
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe.user) {
                userId = window.Telegram.WebApp.initDataUnsafe.user.id.toString();
            }

            if (typeof show_11673272 === 'function') {
                show_11673272({ type: 'pop', ymid: userId })
                    .then(() => {
                        console.log("Xem quảng cáo thành công!");
                        if (window.Telegram.WebApp.HapticFeedback) {
                            window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                        }
                        alert("Tuyệt vời! Bạn đã nhận được thưởng.");
                    })
                    .catch((err) => {
                        console.error("Chưa thể mở quảng cáo:", err);
                        if (window.Telegram.WebApp.HapticFeedback) {
                            window.Telegram.WebApp.HapticFeedback.notificationOccurred('error');
                        }
                    });
            } else {
                alert("Hệ thống quảng cáo đang kết nối, vui lòng bấm lại sau ít giây!");
            }
        }
    </script>
